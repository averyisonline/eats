<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Wheel of Dinner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='82' font-size='85' text-anchor='middle'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* Layout: single centred column. Wheel on top, result line, then protein toggles. */
:root {
  --bg: #f6f7f5;
  --fg: #1c2420;
  --muted: #66716b;
  --line: #c9d0cb;
  --s1: #2f6f5e;
  --s2: #e3b448;
  --s3: #c8573e;
  --on-slice: #ffffff;
  --on-s2: #1c2420;
  --btn-bg: #ffffff;
  --btn-off-bg: #e6e9e6;
  --focus: #1a5fd0;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815;
    --fg: #e8ece9;
    --muted: #9aa5a0;
    --line: #34403a;
    --s1: #3c8a75;
    --s2: #c99a2e;
    --s3: #b94a33;
    --on-slice: #ffffff;
    --on-s2: #131815;
    --btn-bg: #1e2622;
    --btn-off-bg: #131815;
    --focus: #6fa3ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131815;
  --fg: #e8ece9;
  --muted: #9aa5a0;
  --line: #34403a;
  --s1: #3c8a75;
  --s2: #c99a2e;
  --s3: #b94a33;
  --on-slice: #ffffff;
  --on-s2: #131815;
  --btn-bg: #1e2622;
  --btn-off-bg: #131815;
  --focus: #6fa3ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
h1 {
  margin: 0;
  font-family: var(--font);
  font-size: clamp(1.75rem, 7vw, 2.5rem);
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
  text-wrap: balance;
}
.hint {
  margin: 0 0 -8px;
  color: var(--muted);
  font-size: 1rem;
  text-align: center;
}
.wheel-wrap {
  position: relative;
  width: min(100%, 520px);
  aspect-ratio: 1;
}
#wheel {
  display: block;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: none;
  border-radius: 50%;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#wheel:disabled { cursor: default; }
#wheel:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
canvas { width: 100%; height: 100%; display: block; }
.pointer {
  position: absolute;
  left: 50%;
  top: -4px;
  width: 0;
  height: 0;
  transform: translateX(-50%);
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 22px solid var(--fg);
  pointer-events: none;
}
#result {
  min-height: 2.4em;
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;
  text-wrap: balance;
}
#proteins {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}
#proteins button {
  font: inherit;
  font-weight: 600;
  min-height: 44px;
  padding: 0 18px;
  color: var(--fg);
  background: var(--btn-bg);
  border: 2px solid var(--fg);
  border-radius: 999px;
  cursor: pointer;
}
#proteins button[aria-pressed="true"] {
  background: var(--btn-off-bg);
  color: var(--muted);
  border-color: var(--line);
  text-decoration: line-through;
}
#proteins button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
#proteins button:disabled { opacity: .6; cursor: default; }
body { margin: 0; }
</style>
</head>
<body>
<main>
  <h1>What's for dinner?</h1>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <button id="wheel" type="button" aria-label="Spin the wheel"><canvas id="cv"></canvas></button>
  </div>
  <p id="result" aria-live="polite"></p>
  <p class="hint">Tap to exclude proteins</p>
  <ul id="proteins"></ul>
</main>

<script>
(function () {
  var MEALS = [
    ["Basa, pasta, veggies", "Fish"],
    ["Spaghetti Bolognese", "Beef"],
    ["Chilli con carne", "Beef"],
    ["Chicken, pasta, veggies", "Chicken"],
    ["Cottage Pie", "Beef"],
    ["Meatballs with Orzo", "Beef"],
    ["Chicken chasseur", "Chicken"],
    ["Chicken Pie Thing", "Chicken"],
    ["Chicken Stir Fry", "Chicken"],
    ["Beef Stir Fry", "Beef"],
    ["Pork Stir Fry", "Pork"],
    ["Pork chop, pasta, veggies", "Pork"],
    ["Pork chop, potatoes, veggies", "Pork"],
    ["Chicken, mash, veggies", "Chicken"],
    ["Cheesy oven-baked risotto", "N/A"],
    ["Soup", "N/A"],
    ["Chicken Curry", "Chicken"],
    ["Bean Goulash", "Beans"],
    ["Daal", "Lentils"],
    ["Fajitas", "Chicken"],
    ["Enchiladas", "Chicken"]
  ].map(function (m) { return { name: m[0], protein: m[1] }; });

  var proteins = [];
  MEALS.forEach(function (m) { if (proteins.indexOf(m.protein) < 0) proteins.push(m.protein); });
  var excluded = {};
  var rotation = 0;      // radians, wheel rotation
  var spinning = false;

  var btn = document.getElementById("wheel");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var resultEl = document.getElementById("result");
  var list = document.getElementById("proteins");

  function active() { return MEALS.filter(function (m) { return !excluded[m.protein]; }); }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function draw() {
    var dpr = window.devicePixelRatio || 1;
    var size = Math.round(cv.getBoundingClientRect().width);
    if (!size) return;
    if (cv.width !== size * dpr) { cv.width = size * dpr; cv.height = size * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);

    var items = active();
    var n = items.length;
    var c = size / 2, r = c - 3;
    var tones = [css("--s1"), css("--s2"), css("--s3")];
    var texts = [css("--on-slice"), css("--on-s2"), css("--on-slice")];
    var line = css("--bg");

    if (!n) {
      ctx.fillStyle = css("--btn-off-bg");
      ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = css("--line"); ctx.lineWidth = 2; ctx.stroke();
      return;
    }

    var a = (Math.PI * 2) / n;
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(rotation);
    for (var i = 0; i < n; i++) {
      var t = i % 3;
      if (i === n - 1 && n > 1 && t === 0) t = 1;
      var start = -Math.PI / 2 + i * a - a / 2 + a / 2; // slice i is centred on angle i*a from top
      start = -Math.PI / 2 + i * a;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, start, start + a);
      ctx.closePath();
      ctx.fillStyle = n === 1 ? tones[0] : tones[t];
      ctx.fill();
      ctx.strokeStyle = line; ctx.lineWidth = 1.5; ctx.stroke();

      // label along the spoke
      ctx.save();
      ctx.rotate(start + a / 2);
      ctx.fillStyle = n === 1 ? texts[0] : texts[t];
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      var maxW = r * 0.62;
      var fs = Math.max(10, Math.min(16, r * a * 0.32, size * 0.04));
      ctx.font = "600 " + fs + "px " + css("--font");
      while (ctx.measureText(items[i].name).width > maxW && fs > 8) {
        fs -= 0.5;
        ctx.font = "600 " + fs + "px " + css("--font");
      }
      ctx.fillText(items[i].name, r - 12, 0);
      ctx.restore();
    }
    ctx.restore();

    // hub
    ctx.beginPath(); ctx.arc(c, c, size * 0.09, 0, Math.PI * 2);
    ctx.fillStyle = css("--bg"); ctx.fill();
    ctx.strokeStyle = css("--fg"); ctx.lineWidth = 2; ctx.stroke();
    ctx.font = Math.round(size * 0.09) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = css("--fg");
    ctx.fillText("🍴", c, c + size * 0.005);
  }

  function renderButtons() {
    list.innerHTML = "";
    proteins.forEach(function (p) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.id = "protein-" + p.replace(/[^a-z0-9]/gi, "").toLowerCase();
      b.textContent = p;
      b.setAttribute("aria-pressed", excluded[p] ? "true" : "false");
      b.disabled = spinning;
      b.addEventListener("click", function () {
        if (spinning) return;
        excluded[p] = !excluded[p];
        resultEl.textContent = "";
        renderButtons();
        draw();
      });
      li.appendChild(b);
      list.appendChild(li);
    });
    btn.disabled = spinning || active().length === 0;
  }

  function spin() {
    var items = active();
    if (spinning || !items.length) return;
    var n = items.length, a = (Math.PI * 2) / n;
    spinning = true;
    resultEl.textContent = "";
    renderButtons();

    var winner = Math.floor(Math.random() * n);
    // pointer is at top; slice w centre sits at angle (w + 0.5) * a from top when rotation = 0.
    var jitter = (Math.random() - 0.5) * a * 0.8;
    var target = -((winner + 0.5) * a) + jitter;
    var turns = 5 + Math.floor(Math.random() * 3);
    var cur = ((rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    var tgtNorm = ((target % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    var delta = ((tgtNorm - cur) + Math.PI * 2) % (Math.PI * 2) + turns * Math.PI * 2;
    var from = rotation, dur = 4200, t0 = null;

    function frame(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - p, 4);
      rotation = from + delta * e;
      draw();
      if (p < 1) { requestAnimationFrame(frame); return; }
      spinning = false;
      resultEl.textContent = items[winner].name;
      renderButtons();
    }
    requestAnimationFrame(frame);
  }

  btn.addEventListener("click", spin);
  window.addEventListener("resize", draw);
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", draw);
  }
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  renderButtons();
  draw();
})();
</script>
</body>
</html>
